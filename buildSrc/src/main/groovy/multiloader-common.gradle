plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    implementation('de.poiu.apron:apron:2.1.1')
    //toml
    implementation 'io.github.wasabithumb:jtoml:0.6.2'
    implementation 'io.github.wasabithumb:jtoml-api:0.6.2'
    implementation 'io.github.wasabithumb:jtoml-internals:0.6.2'
    implementation 'io.github.wasabithumb:jtoml-serializer-reflect:0.6.2'
    implementation 'io.github.wasabithumb:jtoml-serializer-gson:0.6.2'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
