plugins {
    id 'multiloader-non-mod'
    id 'application'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    // apache commons
    implementation 'org.apache.commons:commons-text:1.12.0'

    // annotations
    implementation 'org.jetbrains:annotations:24.0.0'
    //oshi
    implementation 'com.github.oshi:oshi-core:6.4.10'
    //gson
    implementation 'com.google.code.gson:gson:2.11.0'
    //toml
    implementation 'io.github.wasabithumb:jtoml:0.6.4'
    implementation 'io.github.wasabithumb:jtoml-serializer-reflect:0.6.4'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'fr.raconteur.sbcou.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

application {
    mainClass = 'fr.raconteur.sbcou.Main'
}