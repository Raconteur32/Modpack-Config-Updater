plugins {
    id('multiloader-common')
}

dependencies {
    // jsonata
    implementation group: 'com.dashjoin', name: 'jsonata', version: '0.9.7'

    // apache commons
    implementation 'org.apache.commons:commons-text:1.12.0'

    // tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'

    // annotations
    implementation 'org.jetbrains:annotations:24.0.0'
    //oshi
    implementation 'com.github.oshi:oshi-core:6.4.10'
    //gson
    implementation 'com.google.code.gson:gson:2.11.0'
    //toml
    implementation 'io.github.wasabithumb:jtoml:0.6.2'
    implementation 'io.github.wasabithumb:jtoml-serializer-reflect:0.6.2'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

tasks.test {
    useJUnitPlatform()
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}